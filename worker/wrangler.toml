#:schema node_modules/wrangler/config-schema.json
# ==========================================================
# SHIV YOGI AUTO WELCOME BOT
# Created By Shiv Yogi
# Cloudflare Worker Configuration
# ==========================================================

name = "shiv-yogi-auto-welcome"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Public environment variables (NON-SENSITIVE ONLY)
[vars]
OWNER_TELEGRAM_ID = "YOUR_TELEGRAM_USER_ID"

# 1. Cloudflare KV Binding (Settings, Messages, Lightweight State)
[[kv_namespaces]]
binding = "WELCOME_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 2. Cloudflare D1 Database Binding (History, Metrics, Users)
[[d1_databases]]
binding = "DB"
database_name = "shiv-yogi-welcome-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 3. Cloudflare Durable Objects (Reliable Inactivity Timers)
[durable_objects]
bindings = [
  { name = "TIMER_DO", class_name = "TimerDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["TimerDurableObject"]

# SENSITIVE SECRETS (Set via `wrangler secret put <NAME>`):
# - BOT_TOKEN
# - WEBHOOK_SECRET
# - COMPANION_SECRET
